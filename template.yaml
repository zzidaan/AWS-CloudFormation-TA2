AWSTemplateFormatVersion: '2010-09-09'
Description: TA-2 event-driven serverless file processing with S3, Lambda, VPC, NAT, and SNS.

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address that will receive file-processing alerts.
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Enter a valid email address.

Resources:
  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: TA2-InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: TA2-Public-Subnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: TA2-Private-Subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-Public-RouteTable

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: TA2-NAT-EIP

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnetRouteTableAssociation
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: TA2-NAT-Gateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC
      Tags:
        - Key: Name
          Value: TA2-Private-RouteTable

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FileProcessingVPC
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow outbound connections from the processing Lambda.
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: TA2-Lambda-SG

  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FileProcessingTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  FileProcessingBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Sub 'ta2-fileprocessing-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt FileProcessingLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      Tags:
        - Key: Name
          Value: TA2-FileProcessing-Bucket

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: TA2-S3AndSNSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAndWriteObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::ta2-fileprocessing-${AWS::AccountId}-${AWS::Region}/*'
              - Sid: PublishAlerts
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref FileProcessingTopic

  FileProcessingLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TA2-FileProcessingLambda
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic
          OUTPUT_PREFIX: processed/
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone
          import boto3

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              results = []
              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  try:
                      response = s3.get_object(Bucket=bucket, Key=key)
                      body = response["Body"]
                      size = response.get("ContentLength", 0)
                      body.close()

                      metadata = {
                          "status": "SUCCESS",
                          "source_bucket": bucket,
                          "source_key": key,
                          "size_bytes": size,
                          "processed_at_utc": datetime.now(timezone.utc).isoformat(),
                          "lambda_request_id": context.aws_request_id
                      }
                      output_key = os.environ["OUTPUT_PREFIX"] + key.replace("/", "_") + ".json"
                      s3.put_object(
                          Bucket=bucket,
                          Key=output_key,
                          Body=json.dumps(metadata, indent=2).encode("utf-8"),
                          ContentType="application/json"
                      )
                      message = (
                          "File processed successfully.\n"
                          f"Bucket: {bucket}\n"
                          f"Object: {key}\n"
                          f"Size: {size} bytes\n"
                          f"Metadata log: s3://{bucket}/{output_key}"
                      )
                      sns.publish(
                          TopicArn=os.environ["SNS_TOPIC_ARN"],
                          Subject="S3 File Processing Successful",
                          Message=message
                      )
                      results.append(metadata)
                  except Exception as exc:
                      sns.publish(
                          TopicArn=os.environ["SNS_TOPIC_ARN"],
                          Subject="S3 File Processing Failed",
                          Message=f"Failed to process s3://{bucket}/{key}\nError: {str(exc)}"
                      )
                      raise
              return {"statusCode": 200, "processed": results}

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref FileProcessingLambda
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  S3BucketName:
    Description: Upload test files to this bucket under the uploads/ prefix.
    Value: !Ref FileProcessingBucket
  LambdaFunctionName:
    Value: !Ref FileProcessingLambda
  SNSTopicArn:
    Value: !Ref FileProcessingTopic
  VPCId:
    Value: !Ref FileProcessingVPC
  PublicSubnetId:
    Value: !Ref PublicSubnet
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
